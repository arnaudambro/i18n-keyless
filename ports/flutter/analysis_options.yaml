include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # The example app is analyzed from the package root as well.
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    public_member_api_docs: false
