[project]
name = "i18n-keyless-example-python"
version = "0.0.0"
description = "Two pages served by http.server, translated with i18n-keyless"
requires-python = ">=3.9"
dependencies = ["i18n-keyless"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
# Always the local port, like the JavaScript examples consume `file:../../packages/*`.
i18n-keyless = { path = "../../ports/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
